spring.application.name=circuits

server.port = 8080

spring.datasource.url = jdbc:mysql://localhost:3306/circuits?serverTimezone=UTC&autoReconnect=true&useSSL=false
spring.datasource.username = circuits
spring.datasource.password = circuits123
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServer8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver


# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = create

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

